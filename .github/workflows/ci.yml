name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.8", "3.10", "3.12"]
        include:
          # This tool's only real deployment is a Windows scheduled task, and
          # its worst bug to date (#16) was Windows-only: when stdout is
          # redirected, Windows falls back to cp1252, which cannot encode the
          # mark used to flag a broken link -- so the run died on its first
          # real finding. Linux-only CI could not see it, and the tests added
          # to prevent a recurrence only prove anything on a Windows runner.
          #
          # One job on the current Python is enough. The version floor is
          # already covered by the Linux matrix, and 3.8 predates the Windows
          # images we would want to pin to.
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Import smoke test
        run: |
          python -c "import substack_link_checker; print('import OK')"
          substack-link-checker --help
          substack-link-checker check --help
      - name: Run tests
        run: pytest -q

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build distributions
        run: |
          pip install build
          python -m build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
